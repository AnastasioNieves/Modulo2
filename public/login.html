<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | AprenTIC Campus</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="login-page">
    <main class="login-window" aria-labelledby="loginTitle">
      <section class="login-panel">
        <div class="brand login-brand">
          <div class="brand-mark">A</div>
          <div>
            <strong>AprenTIC</strong>
            <span>Campus API</span>
          </div>
        </div>

        <div class="panel-heading">
          <div>
            <p class="eyebrow">Acceso seguro</p>
            <h1 id="loginTitle">Iniciar sesion</h1>
          </div>
          <span id="apiStatus" class="status-pill muted">API</span>
        </div>

        <form id="loginForm" class="login-form" method="post" action="/api/auth/login">
          <label>
            Email
            <input id="email" name="email" type="email" autocomplete="username" required>
          </label>
          <label>
            Password
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </label>

          <button id="submitBtn" class="primary" type="submit">Entrar al panel</button>
        </form>

        <p id="loginMessage" class="message"></p>
      </section>
    </main>

    <script src="/login.js"></script>
  </body>
</html>
